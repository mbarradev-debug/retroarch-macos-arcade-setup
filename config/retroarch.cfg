# Settings applied on top of RetroArch's defaults by install.sh.
# Only these keys are merged into your retroarch.cfg; everything else is left untouched.

# Vulkan (via the bundled MoltenVK) is the global driver. On RetroArch 1.22.x the
# Metal driver stalls after a few seconds on macOS 26 and cannot host hardware-
# rendered 3D cores. Cores that only speak OpenGL switch to glcore automatically.
video_driver = "vulkan"
driver_switch_enable = "true"

# PlayStation-style menu.
menu_driver = "xmb"

# Download cores for Apple Silicon from the libretro buildbot.
core_updater_buildbot_cores_url = "https://buildbot.libretro.com/nightly/apple/osx/arm64/latest/"

# Thumbnails: boxart on the right, in-game snap on the left, fetched on demand.
network_on_demand_thumbnails = "true"
menu_thumbnails = "3"
menu_left_thumbnails = "1"

# Identify games by CRC/serial when scanning, so renamed files still match.
scan_serial_and_crc = "true"

# Per-core shader presets and per-core overrides (run-ahead, etc.).
video_shader_enable = "true"
auto_shaders_enable = "true"
auto_overrides_enable = "true"
global_core_options = "false"
