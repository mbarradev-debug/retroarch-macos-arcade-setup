# Settings applied on top of RetroArch's defaults by install.sh.
# Only these keys are merged into your retroarch.cfg; everything else is left untouched.

# Vulkan (MoltenVK, which runs on Metal underneath) is the global driver. On
# RetroArch 1.22.2 with macOS 26 the native Metal driver stops drawing 10-20 seconds
# into a game (CPU drops to 0%, verified with Snes9x); Vulkan runs the same slang
# presets without stalling. Cores that only speak OpenGL switch to glcore on their own.
video_driver = "vulkan"
driver_switch_enable = "true"

# Full screen from launch, so the whole setup is usable with a controller alone.
video_fullscreen = "true"
video_windowed_fullscreen = "true"

# Integer scaling on the vertical axis only: scanlines land on whole display rows
# (no moire), while the width follows each system's own aspect ratio.
video_scale_integer = "true"
video_scale_integer_axis = "0"
video_scale_integer_scaling = "0"
aspect_ratio_index = "22"
video_smooth = "false"

# PlayStation-style menu.
menu_driver = "xmb"

# Download cores for Apple Silicon from the libretro buildbot.
core_updater_buildbot_cores_url = "https://buildbot.libretro.com/nightly/apple/osx/arm64/latest/"

# Thumbnails: boxart on the right, in-game snap on the left, fetched on demand.
network_on_demand_thumbnails = "true"
menu_thumbnails = "3"
menu_left_thumbnails = "1"

# Identify games by CRC/serial when scanning, so renamed files still match.
scan_serial_and_crc = "true"

# Shaders: shaders/presets/global.slangp for every core, per-core presets where a
# system needs a different look (handheld LCDs), and per-core overrides.
video_shader_enable = "true"
auto_shaders_enable = "true"
auto_overrides_enable = "true"
global_core_options = "false"

# Controller: the GameController (mfi) driver, autoconfigured into port 1.
# The mfi driver delivers the printed A as RetroPad B (see the autoconfig profile),
# so the per-core remaps in config/remaps cross A/B and X/Y for games, and the swap
# below makes the printed A confirm and B go back in the menu, as on a Switch.
input_joypad_driver = "mfi"
input_autodetect_enable = "true"
input_player1_joypad_index = "0"
auto_remaps_enable = "true"
input_remap_binds_enable = "true"
# RetroArch otherwise writes the remap it has loaded back to disk when a game
# closes, replacing the files from config/remaps with whatever was in memory.
# Saving a remap from Quick Menu -> Controls still works.
remap_save_on_exit = "false"
menu_swap_ok_cancel_buttons = "true"

# Hotkeys: hold ZL and press a second button. HOME belongs to macOS (it opens the
# Games app), and Select cannot be the hotkey button because RetroArch blocks game
# input while it is held. Button numbers are the mfi indices listed in
# autoconfig/mfi/8BitDo_NS30_Pro_Switch.cfg.
input_enable_hotkey_btn = "12"
input_menu_toggle_btn = "3"
input_close_content_btn = "2"
input_save_state_btn = "11"
input_load_state_btn = "10"
input_hold_fast_forward_btn = "13"
input_state_slot_increase_btn = "7"
input_state_slot_decrease_btn = "6"
input_menu_toggle_gamepad_combo = "0"
input_quit_gamepad_combo = "0"
# Closing a game (ZL + -) quits RetroArch when the game was started from the
# command line, as ES-DE does, so you land back in ES-DE. Started from RetroArch's
# own menu, closing a game still returns to that menu. 0 = off, 1 = always, 2 = CLI.
quit_on_close_content = "2"
