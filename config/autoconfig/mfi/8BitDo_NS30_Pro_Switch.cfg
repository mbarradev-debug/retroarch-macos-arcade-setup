# 8BitDo NS30 Pro in Switch mode (macOS sees it as a "Switch Pro Controller").
#
# On RetroArch 1.22 the mfi driver ignores the button numbers below for RetroPad
# buttons: apple_gamecontroller_joypad_state() only checks that a button is bound,
# then reads a fixed bit (Apple buttonA = RetroPad B, buttonB = A, buttonX = Y,
# buttonY = X). macOS reports this pad by printed letter, so the face buttons are
# put right by the per-core remaps in config/remaps, and the menu by
# menu_swap_ok_cancel_buttons. The numbers here match what the driver does.
#
# What this profile still provides: digital ZL/ZR binds (hotkeys do use the
# numbers; the ZL hotkey in retroarch.cfg needs them), labels and a display name.
# The device name sits in the _alt1 slot on purpose: an alternative entry adds 1
# to the match score (21), so this profile wins over the stock MFi_Controller.cfg
# (20) without editing it. Any other mfi controller connected gets it too.
#
# mfi button indices are RetroPad bit numbers:
#   0 = Apple buttonA (printed A)   8 = buttonB (printed B)
#   1 = buttonX (printed X)         9 = buttonY (printed Y)
#   2 = minus  3 = plus  4-7 = d-pad up/down/left/right
#   10/11 = L/R  12/13 = ZL/ZR  14/15 = stick clicks  16 = HOME (taken by macOS)

input_driver = "mfi"
input_device_alt1 = "mFi Controller"
input_device_display_name_alt1 = "8BitDo NS30 Pro (Switch mode)"

input_a_btn = "8"
input_b_btn = "0"
input_x_btn = "9"
input_y_btn = "1"
input_select_btn = "2"
input_start_btn = "3"
input_up_btn = "4"
input_down_btn = "5"
input_left_btn = "6"
input_right_btn = "7"
input_l_btn = "10"
input_r_btn = "11"
input_l2_btn = "12"
input_r2_btn = "13"
input_l3_btn = "14"
input_r3_btn = "15"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "-1"
input_l_y_minus_axis = "+1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "-3"
input_r_y_minus_axis = "+3"

input_a_btn_label = "B"
input_b_btn_label = "A"
input_x_btn_label = "Y"
input_y_btn_label = "X"
input_select_btn_label = "Minus"
input_start_btn_label = "Plus"
input_up_btn_label = "D-Pad Up"
input_down_btn_label = "D-Pad Down"
input_left_btn_label = "D-Pad Left"
input_right_btn_label = "D-Pad Right"
input_l_btn_label = "L"
input_r_btn_label = "R"
input_l2_btn_label = "ZL"
input_r2_btn_label = "ZR"
input_l3_btn_label = "L Stick"
input_r3_btn_label = "R Stick"
input_l_x_plus_axis_label = "Left Analog X+"
input_l_x_minus_axis_label = "Left Analog X-"
input_l_y_plus_axis_label = "Left Analog Y+"
input_l_y_minus_axis_label = "Left Analog Y-"
input_r_x_plus_axis_label = "Right Analog X+"
input_r_x_minus_axis_label = "Right Analog X-"
input_r_y_plus_axis_label = "Right Analog Y+"
input_r_y_minus_axis_label = "Right Analog Y-"
